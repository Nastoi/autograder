services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    env_file: !override
      - .env.prod

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      "

    volumes: !override
      - media_data:/app/media
      - static_data:/app/staticfiles

    ports: !override
      - "127.0.0.1:8000:8000"

    

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api

    volumes: !override []

    ports: !override
      - "127.0.0.1:3000:80"

volumes:
  media_data:
  static_data: