name: autograder CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: autograder_test
          POSTGRES_USER: autograder
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autograder -d autograder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-secret
      DJANGO_DEBUG: "False"
      DEBUG: "False"

      POSTGRES_DB: autograder_test
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: test-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable pgvector
        working-directory: backend
        run: |
          python - <<'PY'
          import psycopg

          connection = psycopg.connect(
              dbname="template1",
              user="autograder",
              password="test-password",
              host="localhost",
              port=5432,
          )
          connection.autocommit = True

          with connection.cursor() as cursor:
              cursor.execute(
                  "CREATE EXTENSION IF NOT EXISTS vector;"
              )

          connection.close()
          PY

      - name: Check Django configuration
        working-directory: backend
        run: python manage.py check
        env:
          LTI_PLATFORM_ISSUER:"https://claaslms.educlaas.com"
          LTI_CLIENT_ID:"b1975e1b-c3db-4170-8a42-129b1745553b"
          LTI_JWKS_URL:"https://claaslms.educlaas.com/api/lti_consumer/v1/public_keysets/6f12ea60-b36c-47ef-a1c8-78894bf8d73a"
          LTI_LOGIN_URL:"https://claaslms.educlaas.com/api/lti_consumer/v1/launch/""
          LTI_PLATFORM_DEPLOYMENT_ID:"1"

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run backend tests
        working-directory: backend
        run: python manage.py test

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker services
        run: docker compose build
